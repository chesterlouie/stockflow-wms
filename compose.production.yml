services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockflow}
      POSTGRES_USER: ${POSTGRES_USER:-stockflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - stockflow_postgres:/var/lib/postgresql/data
      - ./database/bootstrap.sql:/docker-entrypoint-initdb.d/000-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockflow_admin} -d ${POSTGRES_DB:-stockflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://stockflow_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-stockflow}
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER:-stockflow_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stockflow}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      APP_URL: https://${STOCKFLOW_HOST:-stockflow.local}
      PAYMONGO_SECRET_KEY: ${PAYMONGO_SECRET_KEY:-}
      PAYMONGO_WEBHOOK_SECRET: ${PAYMONGO_WEBHOOK_SECRET:-}
      PAYMONGO_PLAN_STARTER_MONTHLY: ${PAYMONGO_PLAN_STARTER_MONTHLY:-}
      PAYMONGO_PLAN_STARTER_ANNUAL: ${PAYMONGO_PLAN_STARTER_ANNUAL:-}
      PAYMONGO_PLAN_GROWTH_MONTHLY: ${PAYMONGO_PLAN_GROWTH_MONTHLY:-}
      PAYMONGO_PLAN_GROWTH_ANNUAL: ${PAYMONGO_PLAN_GROWTH_ANNUAL:-}
      PAYMONGO_PLAN_BUSINESS_MONTHLY: ${PAYMONGO_PLAN_BUSINESS_MONTHLY:-}
      PAYMONGO_PLAN_BUSINESS_ANNUAL: ${PAYMONGO_PLAN_BUSINESS_ANNUAL:-}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      STOCKFLOW_HOST: ${STOCKFLOW_HOST:-stockflow.local}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-stockflow}
      PGUSER: ${POSTGRES_USER:-stockflow_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./ops/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup-loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  stockflow_postgres:
  caddy_data:
  caddy_config:
